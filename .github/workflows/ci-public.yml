# CI for a PUBLIC repository — self-contained, GitHub-hosted runners.
#
# ⛔ Why this file replaces `.github/workflows/ci.yml` rather than extending it:
#   1. A public repo CANNOT consume the estate archetype
#      (the estate's private `rust-service.yml` archetype): a public
#      workflow cannot read a private repo. The run does not fail — it dies at startup with
#      zero jobs.
#   2. A public repo CANNOT use the ARC self-hosted pools. Both org runner groups have
#      `allows_public_repositories:false`, and that must stay false: a fork PR can edit
#      `runs-on`, so a self-hosted runner open to a public repo is arbitrary untrusted code
#      inside the estate network. A job that asks for one sits QUEUED forever, with no
#      error anywhere, and `check-failures.sh` cannot see it (it queries only completed runs).
#   3. GitHub-hosted standard runners are free and unlimited on public repos.
#
# ⛔ Every job is gated on `!github.event.repository.private`. The org's Actions billing is in
#    a failed state, so a PRIVATE repo cannot start an ubuntu-latest job at all — it fails
#    UNSTARTED (steps: [], startedAt == createdAt, no log). The gate lets this file land while
#    the repo is private (jobs report "skipped", never red) and activate with zero edits at the
#    flip. The consequence is load-bearing: CI CANNOT be verified before the flip, so the first
#    real run is the one immediately after it.
#
# The gates below are the archetype's, copied: fmt, clippy -D warnings, nextest + doctests,
# cargo audit, plus a secret scan and a private-reference scan.
#
# Nothing here needs a repository secret. The only token is the automatic one, used to push
# an image from main.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run for main: its image job is what publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Credentials first. A public repo is where a leak does the most damage.
  # `--config` IS REQUIRED: without it betterleaks scans with its BUILT-IN defaults, which
  # are not gitleaks' defaults and produce hundreds of false positives on local dev DSNs.
  secret-scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install betterleaks 1.10.1 (pinned, sha256-verified)
        run: |
          set -euo pipefail
          version=1.10.1
          sha=c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
          curl -fsSL -o "$RUNNER_TEMP/betterleaks.tgz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${version}/betterleaks_${version}_linux_x64.tar.gz"
          echo "${sha}  $RUNNER_TEMP/betterleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tgz" -C "$RUNNER_TEMP" betterleaks
      - name: scan the tree
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/betterleaks" dir --redact --exit-code 1 --no-banner \
            --config=.betterleaks.toml \
            --gitleaks-ignore-path .betterleaksignore .

  # Private infrastructure must not be published: internal hostnames, tailnet addresses,
  # private repo paths — the half a credential scanner does not catch.
  # Run the same script locally before pushing: `bash scripts/ci/no-private-refs.sh`.
  no-private-refs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: scan tracked files
        run: bash scripts/ci/no-private-refs.sh

  checks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Drops the DWARF, which is what makes target/ multi-gigabyte.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - uses: actions/cache@v6
        with:
          # Registry only: target/ is multi-gigabyte and would thrash the 10 GB cache budget.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # No database, cache or other service container: every test in this repo runs
      # against a stand-in `lake`/`lean` and needs nothing outside the crate.

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo nextest (0.9.150 pinned, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/nextest.tgz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz"
          echo "b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  $RUNNER_TEMP/nextest.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tgz" -C "$RUNNER_TEMP" cargo-nextest
          "$RUNNER_TEMP/cargo-nextest" nextest run --no-tests=fail --color never --locked
          cargo test --doc --locked

      - name: cargo audit 0.22.2 (pinned, sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/audit.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" audit


  # The per-merge image (Dockerfile.runtime): the PUBLISHED lean base + the binary built
  # above. The base carries elan, the pinned Lean toolchain and Mathlib (~10.6 GB) and
  # takes ~25 GB to build, so it is never built here — it is published rarely by
  # scripts/publish-lean-base.sh and pinned by digest. Each job below stays inside the
  # runner's ~14 GB by never holding the image twice: `cacheonly` on PRs, `--push` on
  # main, a separate pull+smoke job, and an instant tag move for `latest`.
  binary:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The Dockerfile's rust-build stage pin; the shipped binary is built with the same
      # toolchain rather than whatever `stable` the runner happens to carry.
      RUSTUP_TOOLCHAIN: "1.100.0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup show
          rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo build --release
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: lean4-prover-binary
          path: target/release/lean4-prover
          if-no-files-found: error

  image:
    needs: binary
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nonagenticai/lean4-prover
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: lean4-prover-binary
          path: artifact

      # The base tag is a pure function of the two Lean pins. A `lean/` change without a
      # base republish is caught here, with the fix named, instead of silently shipping
      # the old Mathlib.
      - name: resolve the pinned lean base and guard the pins
        id: base
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^ARG LEAN_BASE_IMAGE=//p' Dockerfile.runtime)"
          [ -n "$pinned" ] || { echo "Dockerfile.runtime has no ARG LEAN_BASE_IMAGE" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(cat lean/lean-toolchain lean/lake-manifest.json | sha256sum | cut -d' ' -f1)"
          else
            digest="$(cat lean/lean-toolchain lean/lake-manifest.json | shasum -a 256 | cut -d' ' -f1)"
          fi
          pins8="${digest:0:12}"
          case "$pinned" in
            *":base-lean-$pins8@"*) : ;;
            *)
              echo "lean pins changed: this tree needs base-lean-$pins8, but Dockerfile.runtime pins" >&2
              echo "  $pinned" >&2
              echo "Republish the base with scripts/publish-lean-base.sh and commit the ref it prints." >&2
              exit 1
              ;;
          esac
          echo "base=$pinned" >> "$GITHUB_OUTPUT"
          echo "pins=$pins8" >> "$GITHUB_OUTPUT"

      - name: runner disk
        run: df -h /

      - name: login to ghcr (push only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/setup-buildx-action@v3

      - name: build the runtime image (validate on PR, push on main)
        run: |
          set -euo pipefail
          args=(--file Dockerfile.runtime
                --build-arg "LEAN_BASE_IMAGE=${{ steps.base.outputs.base }}"
                --build-arg "SOURCE_REVISION=$GITHUB_SHA")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker buildx build "${args[@]}" --push \
              --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" \
              --tag "$IMAGE:main-$GITHUB_RUN_NUMBER" .
          else
            docker buildx build "${args[@]}" --output type=cacheonly .
          fi

  # The runtime image is only proven where it can be held once: pull the just-pushed tag,
  # run it, and make a real Lean request against the real Mathlib. The failing theorem is
  # the #787 regression guard — a refusal must come back as diagnostics, not as [].
  # `latest` moves ONLY here, after both requests pass, so Flux can never roll a build
  # that never booted.
  smoke:
    needs: image
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nonagenticai/lean4-prover
    steps:
      - name: login and pull the just-pushed image
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE:sha-${GITHUB_SHA:0:7}"
          df -h /

      # The licence gate defaults to ON and refuses to boot with no introspection URL,
      # so the standalone run sets ENABLE_AUTH=false — the same configuration the README
      # documents. ⛔ NO PIPE on these checks: `grep -q` exits at its first match and the
      # writer dies on SIGPIPE; a bash pattern match on the captured body has no reader.
      - name: run it and prove Lean + Mathlib
        run: |
          set -euo pipefail
          docker run -d --name smoke -e ENABLE_AUTH=false \
            -p 127.0.0.1:18812:8812 "$IMAGE:sha-${GITHUB_SHA:0:7}"
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18812/health/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker logs smoke || true
            echo "the service never answered /health/live" >&2
            exit 1
          fi
          check() {
            curl -fsS -X POST http://127.0.0.1:18812/api/check \
              -H 'Content-Type: application/json' --data-binary "$1"
          }
          good="$(check '{"source":"import Mathlib.Tactic.NormNum\ntheorem t : 1 + 1 = 2 := by norm_num"}')"
          bad="$(check '{"source":"import Mathlib.Tactic.NormNum\ntheorem nope : 1 = 2 := by norm_num"}')"
          docker rm -f smoke >/dev/null 2>&1 || true
          echo "positive: $good"
          echo "negative: $bad"
          [ "${good#*\"valid\":true}" != "$good" ] || { echo "expected valid:true" >&2; exit 1; }
          [ "${bad#*\"valid\":false}" != "$bad" ] || { echo "expected valid:false" >&2; exit 1; }
          [ "${bad#*\"diagnostics\":[]}" = "$bad" ] || { echo "a failing check returned diagnostics: [] — #787 regressed" >&2; exit 1; }

      - name: promote latest (only after the smoke passed)
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:sha-${GITHUB_SHA:0:7}"
          docker buildx imagetools inspect "$IMAGE:latest"
