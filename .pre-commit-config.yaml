# Pre-commit hooks for lean4-prover
# Install: pre-commit install -t pre-commit -t pre-push
# Run all: pre-commit run --all-files
#
# ⚠️ This service is Rust (2026-11-13). The Python tooling that used to live
# here — ruff, ty, pytest, pip-audit — is gone with the Python service. The
# pre-push hook now runs the same gate CI runs, through scripts/pre-push.sh,
# which also pins CARGO_TARGET_DIR so worktrees share one target directory.

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # Dockerfile linting (native binary via brew, no Docker required)
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: [--ignore, DL3008, --ignore, DL3013]  # Allow unpinned apt/pip

  # Secret detection is a CI job (.github/workflows/ci-public.yml runs betterleaks
  # over the tree with .betterleaks.toml). It is not duplicated here because the
  # scanner's rules must stay identical to the one CI uses.

  # The real gate — fmt + clippy + test — only on push (slower).
  - repo: local
    hooks:
      - id: cargo-gate
        name: cargo fmt + clippy + test
        entry: scripts/pre-push.sh
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

# Configuration for ci environments
ci:
  autofix_prs: false
  autoupdate_schedule: monthly
