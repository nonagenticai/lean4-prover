[package]
license = "Apache-2.0"
name = "lean4-prover"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Lean 4 formal verification as a REST API (Rust port of the FastAPI service)"

[dependencies]
axum = "=0.8.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }
tower-http = { version = "=0.7.1", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
thiserror = "=2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
